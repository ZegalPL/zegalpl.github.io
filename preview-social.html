<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Image Preview</title>
  <style>
    body { font-family: 'Ubuntu Mono', monospace; margin: 20px; background: #f3f4fb; color: #2e3192; }
    h1 { margin-bottom: 8px; }
    p { margin-top: 0; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.08); padding: 12px; margin-bottom: 16px; }
    img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid #dde0ff; }
    .label { font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Social Images Preview</h1>
  <p>Quick local preview of LinkedIn, Facebook, and Twitter/X covers.</p>

  <div class="card">
    <div class="label">LinkedIn</div>
    <img src="img/linkedin-background.svg" alt="LinkedIn cover preview">
  </div>

  <div class="card">
    <div class="label">Facebook</div>
    <img src="img/facebook-background.svg" alt="Facebook cover preview">
  </div>

  <div class="card">
    <div class="label">Twitter/X (new)</div>
    <img src="img/twitter-background.svg" alt="Twitter cover preview">
  </div>
</body>
</html>
